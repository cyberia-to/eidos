[package]
name        = "cyber-eidos"
description = "eidos proof assistant — CIC kernel over Goldilocks"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[lints]
workspace = true

[features]
# Proof fixtures live in the sibling ../nox and ../prysm checkouts, not in this
# repository. The tests that embed them compile only when those checkouts are
# present, so they are off by default and a clean clone builds all targets.
sibling-proofs = []

[dependencies]
